# Keep the Gradle daemon heap small. At -Xmx3072m the daemon dies with a
# native-allocation OOM on a 16 GB Windows box once the Flutter tooling and an
# IDE are also resident. 1536m builds this project comfortably and faster.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Windows only: Kotlin's incremental compiler cache can't compute a
# relative path when the project and the Gradle/Pub caches live on
# different drive letters (e.g. project on D:, caches on C:), which
# crashes the build with "Could not close incremental caches ... this
# and base files have different roots". Disabling incremental compilation
# avoids that crash; it costs a little build speed, not correctness.
kotlin.incremental=false