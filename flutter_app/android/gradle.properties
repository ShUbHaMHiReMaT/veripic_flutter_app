# Lower JVM memory allocation to prevent Gradle daemon crashes
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Windows only: Kotlin's incremental compiler cache can't compute a
# relative path when the project and the Gradle/Pub caches live on
# different drive letters (e.g. project on D:, caches on C:), which
# crashes the build with "Could not close incremental caches ... this
# and base files have different roots". Disabling incremental compilation
# avoids that crash; it costs a little build speed, not correctness.
kotlin.incremental=false